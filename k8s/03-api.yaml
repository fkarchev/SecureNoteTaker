apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: secure-notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        # Refers to local docker image for testing. In AWS, this would be an ECR URI.
        image: securitydemo-api:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: api-config
        env:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: MYSQL_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: JWT_SECRET
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: secure-notes
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  # SECURITY: Internal ClusterIP. Only the frontend can communicate with the backend.
  type: ClusterIP
