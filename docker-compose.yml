version: '3.8'

# SECURITY: We define two isolated networks.
# - frontend-net: Communication between Nginx (React) and the Go backend.
# - backend-net: Communication between the Go backend and the MySQL database.
# The frontend cannot directly access the database network.
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: secure-notes-db
    restart: unless-stopped
    # SECURITY: MySQL should only be accessible from the backend network.
    # Exposing ports (like 3306:3306) to the host machine is avoided in production unless strictly necessary, 
    # but for local development, we keep it internal.
    networks:
      - backend-net
    environment:
      # SECURITY: Credentials should be passed via secure secrets managers in production.
      # For this docker-compose setup, we use environment variables.
      MYSQL_DATABASE: secure_notes
      MYSQL_USER: api_user
      MYSQL_PASSWORD: api_password_123 # IN PRODUCTION: Inject via secure secrets
      MYSQL_ROOT_PASSWORD: root_password_123 # IN PRODUCTION: Inject via secure secrets
    volumes:
      - db-data:/var/lib/mysql
      # Mount initialization scripts. These run automatically on first start.
      - ./db-init:/docker-entrypoint-initdb.d

volumes:
  db-data:
