version: '3.8'

# SECURITY: We define two isolated networks.
# - frontend-net: Communication between Nginx (React) and the Go backend.
# - backend-net: Communication between the Go backend and the MySQL database.
# The frontend cannot directly access the database network.
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: secure-notes-db
    restart: unless-stopped
    # SECURITY: MySQL should only be accessible from the backend network.
    networks:
      - backend-net
    environment:
      # SECURITY: In production, use Docker Secrets or AWS Secrets Manager.
      MYSQL_DATABASE: secure_notes
      MYSQL_USER: api_user
      MYSQL_PASSWORD: api_password_123
      MYSQL_ROOT_PASSWORD: root_password_123
    volumes:
      - db-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d

  api:
    build:
      context: ./backend
    container_name: secure-notes-api
    restart: unless-stopped
    # SECURITY: API sits between frontend and backend networks.
    networks:
      - frontend-net
      - backend-net
    environment:
      PORT: "8080"
      DB_HOST: "db"
      DB_USER: "api_user"
      DB_PASS: "api_password_123"
      DB_NAME: "secure_notes"
      # SECURITY: Strong, rotating secrets should be used in production.
      JWT_SECRET: "development_only_secret_key"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: secure-notes-frontend
    restart: unless-stopped
    ports:
      - "80:80" # Exposed to host for access
    networks:
      - frontend-net
    depends_on:
      - api

volumes:
  db-data:
