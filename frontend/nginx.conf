server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # SECURITY: Serve index.html for Single Page Application (SPA) routing, 
        # allowing React Router to handle paths without returning 404s.
        try_files $uri $uri/ /index.html;
    }

    # SECURITY: Proxy API requests directly to the backend service running on the internal docker network.
    # This prevents the need to expose the Go API port directly to the internet.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
    }

    location /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
    }
}
